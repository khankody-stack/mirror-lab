
<!DOCTYPE html>
<html>
<head>
    <title>MediaPipe Face Tracking</title>

    <style>
        body {
            background: #151515;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        #cameraBox {
            position: relative;
            width: 80%;
            max-width: 800px;
            margin: auto;
        }

        video {
            width: 100%;
            display: block;
            border-radius: 10px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Mirror video and landmarks together */
        #cameraBox {
            transform: scaleX(-1);
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            background: purple;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>MediaPipe Face Tracking</h1>

    <div id="cameraBox">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>

    <button onclick="startCamera()">Start Camera</button>
    <button onclick="stopCamera()">Stop Camera</button>

    <p id="status">Loading MediaPipe...</p>

    <script type="module">
        import {
            FaceLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";

        const video = document.getElementById("webcam");
        const canvas = document.getElementById("overlay");
        const ctx = canvas.getContext("2d");
        const statusText = document.getElementById("status");

        let faceLandmarker;
        let stream = null;
        let running = false;

        // Load MediaPipe
        async function loadMediaPipe() {
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
                );

                faceLandmarker = await FaceLandmarker.createFromOptions(
                    vision,
                    {
                        baseOptions: {
                            modelAssetPath:
                                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                            delegate: "CPU"
                        },
                        runningMode: "VIDEO",
                        numFaces: 1
                    }
                );

                statusText.innerText = "MediaPipe ready";
            } catch (error) {
                statusText.innerText = "MediaPipe error: " + error.message;
                console.error(error);
            }
        }

        // Start webcam
        window.startCamera = async function() {
            try {
                if (running) return;

                if (!faceLandmarker) {
                    statusText.innerText = "MediaPipe not ready";
                    return;
                }

                stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

                video.srcObject = stream;
                await video.play();

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                running = true;
                statusText.innerText = "Face tracking running";

                trackFace();

            } catch (error) {
                statusText.innerText = "Camera error: " + error.message;
                console.error(error);
            }
        };

        // Stop webcam
        window.stopCamera = function() {
            running = false;

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            video.srcObject = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            statusText.innerText = "Camera stopped";
        };

        // Detect and draw landmarks
        function trackFace() {
            if (!running) return;

            if (video.readyState >= 2) {
                const results = faceLandmarker.detectForVideo(
                    video,
                    performance.now()
                );

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (const face of results.faceLandmarks) {
                    for (const point of face) {
                        const x = point.x * canvas.width;
                        const y = point.y * canvas.height;

                        ctx.beginPath();
                        ctx.arc(x, y, 1.5, 0, 2 * Math.PI);
                        ctx.fillStyle = "lime";
                        ctx.fill();
                    }
                }
            }

            requestAnimationFrame(trackFace);
        }

        loadMediaPipe();
    </script>

</body>
</html>
